name: Update Plugin Hashes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to fetch latest SHAs from"
        required: true
        default: "develop"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests ruamel.yaml

      - name: Run update-hashes.py
        run: python update-hashes.py --branch "${{ inputs.branch || 'develop' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update plugin hashes"
          branch: update-hashes
          delete-branch: true
          title: "Update plugin hashes"
          body: |
            Automated update of `portal-plugins.yaml` with latest commit SHAs.

            Branch: `${{ inputs.branch || 'develop' }}`
          labels: |
            automated
            dependencies
